<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>倢芯接送班表</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="倢芯接送">
<link rel="apple-touch-icon" href="icon192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --card2: #e8e8ed;
    --accent: #4f46e5;
    --dad: #0077cc;
    --mom: #d63384;
    --grandma: #2d8a4e;
    --text: #1a1a2e;
    --sub: #666680;
    --radius: 14px;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* ── 身份選擇頁 ── */
  #login-page {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100dvh; padding: 32px 24px; gap: 32px;
  }
  #login-page h1 { font-size: 2rem; text-align: center; line-height: 1.4; }
  #login-page h1 span { color: var(--accent); }
  .identity-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; width: 100%; max-width: 380px; }
  .id-btn {
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; padding: 28px 8px; border-radius: var(--radius);
    background: var(--card); border: 2px solid transparent;
    cursor: pointer; transition: all 0.2s; user-select: none;
  }
  .id-btn:active { transform: scale(0.95); }
  .id-btn .emoji { font-size: 4.5rem; }
  .id-btn .name { font-size: 1.6rem; font-weight: 600; }
  .id-btn[data-who="爸爸"] { border-color: var(--dad); }
  .id-btn[data-who="媽媽"] { border-color: var(--mom); }
  .id-btn[data-who="奶奶"] { border-color: var(--grandma); }
  .id-btn[data-who="爸爸"] .name { color: var(--dad); }
  .id-btn[data-who="媽媽"] .name { color: var(--mom); }
  .id-btn[data-who="奶奶"] .name { color: var(--grandma); }

  /* ── 主畫面 ── */
  #main-page { display: none; min-height: 100dvh; }

  /* Header */
  .header {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg); padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #d0d0da;
  }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .user-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 12px; border-radius: 20px;
    font-size: 0.85rem; font-weight: 600;
  }
  .badge-dad { background: rgba(79,195,247,0.15); color: var(--dad); }
  .badge-mom { background: rgba(244,143,177,0.15); color: var(--mom); }
  .badge-grandma { background: rgba(165,214,167,0.15); color: var(--grandma); }
  .header h2 { font-size: 1rem; font-weight: 700; }
  .switch-btn {
    background: var(--card); border: none; color: var(--sub);
    padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer;
  }

  /* Tab bar */
  .tabs {
    display: flex; background: #e0e0ea;
    margin: 12px 16px; border-radius: 10px; padding: 4px; gap: 2px;
  }
  .tab {
    flex: 1; padding: 10px; text-align: center; border-radius: 8px;
    font-size: 0.95rem; font-weight: 600; cursor: pointer; color: var(--sub);
    transition: all 0.2s;
  }
  .tab.active { background: var(--accent); color: white; }

  /* 內容區 */
  .tab-content { padding: 0 16px 100px; display: none; }
  .tab-content.active { display: block; }

  /* 月份導航 */
  .month-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0 16px;
  }
  .month-nav h3 { font-size: 1.1rem; font-weight: 700; }
  .nav-btn {
    background: var(--card); border: none; color: var(--text);
    width: 36px; height: 36px; border-radius: 50%; font-size: 1.1rem;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }

  /* 日曆 */
  .calendar-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  }
  .cal-header { text-align: center; font-size: 0.7rem; color: var(--sub); padding: 4px 0; font-weight: 600; }
  .cal-header:nth-child(1) { color: #ff6b6b; }
  .cal-header:nth-child(7) { color: #74b9ff; }
  .cal-day {
    aspect-ratio: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 8px; cursor: pointer; position: relative;
    gap: 2px; transition: background 0.15s;
  }
  .cal-day:active { transform: scale(0.93); }
  .cal-day.empty { cursor: default; }
  .cal-day .day-num { font-size: 0.78rem; font-weight: 600; line-height: 1; }
  .cal-day .dot-row { display: flex; gap: 2px; }
  .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
  }
  .cal-day.has-mine { background: rgba(108,99,255,0.12); }
  .cal-day.today { outline: 2px solid var(--accent); }
  .cal-day.vacation { background: rgba(255,200,0,0.08); }
  .cal-day .vac-label { font-size: 0.5rem; color: #ffd700; }

  /* 任務卡片 */
  .day-section { margin-bottom: 8px; }
  .day-label {
    font-size: 1.1rem; font-weight: 700; color: var(--sub);
    padding: 12px 0 6px; letter-spacing: 0.05em;
  }
  .day-label.today-label { color: var(--accent); }

  .task-card {
    background: var(--card); border-radius: var(--radius);
    margin-bottom: 8px; overflow: hidden;
    border-left: 4px solid var(--accent);
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    transition: transform 0.1s;
  }
  .task-card:active { transform: scale(0.98); }
  .task-card.mine { border-left-color: var(--accent); }
  .task-card.not-mine { border-left-color: #ccccdd; opacity: 0.6; }

  .task-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 8px;
  }
  .task-name { font-size: 1.4rem; font-weight: 700; }
  .task-time { font-size: 1.1rem; color: var(--sub); }

  .task-body { padding: 0 16px 14px; display: flex; gap: 8px; }
  .assign-chip {
    display: flex; align-items: center; gap: 5px;
    padding: 12px 16px; border-radius: 20px;
    font-size: 1.2rem; font-weight: 600; cursor: pointer;
    flex: 1; justify-content: center;
    transition: all 0.15s;
  }
  .assign-chip:active { transform: scale(0.95); }
  .assign-chip .label { color: var(--sub); font-size: 1rem; margin-right: 2px; }
  .chip-dad { background: rgba(79,195,247,0.15); color: var(--dad); border: 1px solid rgba(79,195,247,0.3); }
  .chip-mom { background: rgba(244,143,177,0.15); color: var(--mom); border: 1px solid rgba(244,143,177,0.3); }
  .chip-grandma { background: rgba(165,214,167,0.15); color: var(--grandma); border: 1px solid rgba(165,214,167,0.3); }
  .chip-none { background: var(--card2); color: var(--sub); border: 1px solid #ccccdd; }

  /* 我的任務列表 */
  .my-tasks-empty {
    text-align: center; padding: 60px 20px;
    color: var(--sub); font-size: 1.2rem; line-height: 2;
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 200; padding: 0;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card); width: 100%; max-width: 480px;
    border-radius: var(--radius) var(--radius) 0 0;
    padding: 24px 20px 40px;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
  .modal-sub { font-size: 0.95rem; color: var(--sub); margin-bottom: 20px; }
  .modal-divider { font-size: 0.75rem; color: var(--sub); margin: 12px 0 8px; font-weight: 600; }
  .person-opts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 4px; }
  .person-opt {
    padding: 16px 4px; border-radius: 10px; text-align: center;
    cursor: pointer; border: 2px solid transparent;
    font-weight: 700; font-size: 1.05rem; transition: all 0.15s;
  }
  .person-opt:active { transform: scale(0.95); }
  .person-opt.dad { background: rgba(79,195,247,0.1); color: var(--dad); }
  .person-opt.dad.selected { border-color: var(--dad); background: rgba(79,195,247,0.25); }
  .person-opt.mom { background: rgba(244,143,177,0.1); color: var(--mom); }
  .person-opt.mom.selected { border-color: var(--mom); background: rgba(244,143,177,0.25); }
  .person-opt.grandma { background: rgba(165,214,167,0.1); color: var(--grandma); }
  .person-opt.grandma.selected { border-color: var(--grandma); background: rgba(165,214,167,0.25); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-cancel { flex: 1; padding: 13px; border-radius: 10px; border: none; background: var(--card2); color: var(--sub); font-size: 0.9rem; cursor: pointer; font-weight: 600; }
  .btn-save { flex: 2; padding: 13px; border-radius: 10px; border: none; background: var(--accent); color: white; font-size: 0.9rem; cursor: pointer; font-weight: 700; }

  /* 同步狀態 */
  .sync-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid #d0d0da;
    padding: 10px 16px; display: flex; align-items: center; justify-content: space-between;
    z-index: 50;
  }
  .sync-status { font-size: 0.75rem; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #4caf50; }
  .sync-dot.syncing { background: #ff9800; animation: pulse 1s infinite; }
  .sync-dot.error { background: #f44336; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
  .sync-btn { background: none; border: 1px solid #aaaacc; color: var(--sub); padding: 4px 12px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; }

  /* Toast */
  .toast {
    position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
    background: #4f46e5; color: white; padding: 10px 20px; border-radius: 20px;
    font-size: 0.82rem; z-index: 300; opacity: 0; transition: opacity 0.3s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }


  /* 七天提醒 */
  .alert-section { margin-bottom: 16px; }
  .alert-title {
    font-size: 0.75rem; font-weight: 700; color: #ff9800;
    padding: 4px 0 8px; display: flex; align-items: center; gap: 6px;
  }
  .alert-card {
    background: #fff8f0; border: 1px solid #ffb347;
    border-radius: 10px; padding: 10px 14px; margin-bottom: 6px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;
  }
  .alert-card:active { transform: scale(0.98); }
  .alert-card .al-left { display: flex; flex-direction: column; gap: 2px; }
  .alert-card .al-name { font-size: 1rem; font-weight: 700; }
  .alert-card .al-date { font-size: 0.88rem; color: #8888aa; }
  .alert-card .al-role { font-size: 0.88rem; color: #ff9800; font-weight: 600; }
  .alert-card .al-assign {
    font-size: 0.8rem; font-weight: 700;
    padding: 5px 10px; border-radius: 8px;
    background: var(--card2); color: var(--sub);
  }
  .no-alerts {
    text-align: center; padding: 12px;
    font-size: 0.8rem; color: #4caf50;
    background: #f0fff4; border-radius: 10px;
    margin-bottom: 16px;
  }

  /* 地址列 */
  .task-addr {
    padding: 0 14px 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .task-addr a {
    font-size: 1rem; color: #7c9fd4;
    text-decoration: none; display: flex; align-items: center; gap: 4px;
  }
  .task-addr a:active { opacity: 0.7; }
  /* 旅行週橫幅 */
  .vacation-banner {
    background: #fffbea; border: 1px solid #f0d060;
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px;
    text-align: center;
  }
  .vacation-banner .v-emoji { font-size: 1.5rem; }
  .vacation-banner .v-text { font-size: 0.85rem; color: #ffd700; font-weight: 600; }
</style>
</head>
<body>

<!-- 設定頁（首次使用）-->
<div id="setup-page" style="display:none">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:32px 24px;gap:24px">
    <div style="font-size:2.5rem">🔑</div>
    <div style="text-align:center">
      <h2 style="font-size:1.2rem;margin-bottom:8px">首次設定</h2>
      <p style="font-size:0.82rem;color:#8888aa;line-height:1.6">請輸入 GitHub Token 和 Gist ID<br>設定一次後自動記住，不用再輸入</p>
    </div>
    <div style="width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px">
      <div>
        <div style="font-size:0.75rem;color:#8888aa;margin-bottom:6px;font-weight:600">GitHub Token（ghp_開頭）</div>
        <input id="setup-token" type="password" placeholder="ghp_xxxx..."
          style="width:100%;padding:12px;border-radius:10px;border:1px solid #3a3a5a;background:#ffffff;color:#1a1a2e;border:1px solid #ccccdd;font-size:0.85rem;outline:none">
      </div>
      <div>
        <div style="font-size:0.75rem;color:#8888aa;margin-bottom:6px;font-weight:600">Gist ID</div>
        <input id="setup-gist" type="text" placeholder="（貼上 Gist ID）"
          style="width:100%;padding:12px;border-radius:10px;border:1px solid #3a3a5a;background:#ffffff;color:#1a1a2e;border:1px solid #ccccdd;font-size:0.85rem;outline:none">
      </div>
      <button onclick="saveSetup()"
        style="padding:14px;border-radius:10px;border:none;background:#6c63ff;color:white;font-size:1.5rem;font-weight:700;cursor:pointer;margin-top:4px">
        儲存並開始使用
      </button>
    </div>
    <p style="font-size:0.72rem;color:#555577;text-align:center">Token 只存在你的手機瀏覽器裡<br>不會上傳到任何地方</p>
  </div>
</div>

<!-- 身份選擇 -->
<div id="login-page">
  <h1>🐼 倢芯<br><span>暑假接送班表</span></h1>
  <div class="identity-grid">
    <div class="id-btn" data-who="爸爸" onclick="login('爸爸')">
      <span class="emoji">👨</span>
      <span class="name">爸爸</span>
    </div>
    <div class="id-btn" data-who="媽媽" onclick="login('媽媽')">
      <span class="emoji">👩</span>
      <span class="name">媽媽</span>
    </div>
    <div class="id-btn" data-who="奶奶" onclick="login('奶奶')">
      <span class="emoji">👵</span>
      <span class="name">奶奶</span>
    </div>
  </div>
  <p style="font-size:1rem;color:#777799;text-align:center">點選你的身份進入班表</p>
</div>

<!-- 主畫面 -->
<div id="main-page">
  <div class="header">
    <div class="header-left">
      <span id="user-badge" class="user-badge"></span>
      <h2>倢芯接送</h2>
    </div>
    <button class="switch-btn" onclick="switchUser()">換人</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('today')">今天</div>
    <div class="tab" onclick="showTab('my')">我的任務</div>
    <div class="tab" onclick="showTab('all')">全部行程</div>
    <div class="tab" onclick="showTab('cal')">月曆</div>
  </div>

  <!-- 今天 -->
  <div id="tab-today" class="tab-content active">
    <div id="today-tasks-list"></div>
  </div>

  <!-- 我的任務 -->
  <div id="tab-my" class="tab-content">
    <div id="alert-section"></div>
    <div id="my-tasks-list"></div>
  </div>

  <!-- 全部行程 -->
  <div id="tab-all" class="tab-content">
    <div id="all-tasks-list"></div>
  </div>

  <!-- 月曆 -->
  <div id="tab-cal" class="tab-content">
    <div class="month-nav">
      <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
      <h3 id="month-title"></h3>
      <button class="nav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="calendar-grid" id="cal-grid"></div>
    <div id="cal-day-detail" style="margin-top:16px"></div>
  </div>

  <div class="sync-bar">
    <div class="sync-status">
      <div class="sync-dot" id="sync-dot"></div>
      <span id="sync-text">載入中…</span>
    </div>
    <button class="sync-btn" onclick="syncData()">同步</button>
  </div>
</div>

<!-- 編輯 Modal -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-sub" id="modal-sub"></div>

    <div class="modal-divider">送去 🚗</div>
    <div class="person-opts" id="dropoff-opts">
      <div class="person-opt dad" onclick="selectPerson('dropoff','爸爸')">👨 爸爸</div>
      <div class="person-opt mom" onclick="selectPerson('dropoff','媽媽')">👩 媽媽</div>
      <div class="person-opt grandma" onclick="selectPerson('dropoff','奶奶')">👵 奶奶</div>
    </div>

    <div class="modal-divider">接回 🏠</div>
    <div class="person-opts" id="pickup-opts">
      <div class="person-opt dad" onclick="selectPerson('pickup','爸爸')">👨 爸爸</div>
      <div class="person-opt mom" onclick="selectPerson('pickup','媽媽')">👩 媽媽</div>
      <div class="person-opt grandma" onclick="selectPerson('pickup','奶奶')">👵 奶奶</div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-save" onclick="saveModal()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>

function saveSetup() {
  const token = document.getElementById('setup-token').value.trim();
  const gist = document.getElementById('setup-gist').value.trim();
  if (!token || !gist) { showToast('請填入 Token 和 Gist ID'); return; }
  localStorage.setItem('pickup_token', token);
  localStorage.setItem('pickup_gist', gist);
  location.reload();
}

function checkSetup() {
  const token = localStorage.getItem('pickup_token');
  const gist = localStorage.getItem('pickup_gist');
  if (!token || !gist) {
    document.getElementById('setup-page').style.display = 'block';
    document.getElementById('login-page').style.display = 'none';
    return false;
  }
  return true;
}

// ── 設定（從 localStorage 讀取）──
const GIST_ID = localStorage.getItem('pickup_gist') || '';

  badge.className = 'user-badge ' + BADGE_CLASS[who];
  syncData();
  renderAll();
}

function switchUser() {
  localStorage.removeItem('pickup_user');
  document.getElementById('login-page').style.display = 'flex';
  document.getElementById('main-page').style.display = 'none';
}

// ── 同步 ──
async function syncData() {
  setSyncStatus('syncing', '同步中…');
  try {
    const r = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      headers: { 'Authorization': `token ${TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    const data = await r.json();
    const content = data.files['assignments.json'].content;
    const parsed = JSON.parse(content);
    if (parsed.assignments && Object.keys(parsed.assignments).length > 0) {
      assignments = parsed.assignments;
    }
    setSyncStatus('ok', '已同步 ' + new Date().toLocaleTimeString('zh-TW', {hour:'2-digit',minute:'2-digit'}));
    renderAll();
  } catch(e) {
    setSyncStatus('error', '同步失敗');
  }
}

async function pushData() {
  setSyncStatus('syncing', '儲存中…');
  try {
    await fetch(`https://api.github.com/gists/${GIST_ID}`, {
      method: 'PATCH',
      headers: {
        'Authorization': `token ${TOKEN}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        files: { 'assignments.json': { content: JSON.stringify({ version: 1, assignments }, null, 2) } }
      })
    });
    setSyncStatus('ok', '已儲存 ' + new Date().toLocaleTimeString('zh-TW', {hour:'2-digit',minute:'2-digit'}));
  } catch(e) {
    setSyncStatus('error', '儲存失敗');
  }
}

function setSyncStatus(state, text) {
  const dot = document.getElementById('sync-dot');
  dot.className = 'sync-dot' + (state === 'syncing' ? ' syncing' : state === 'error' ? ' error' : '');
  document.getElementById('sync-text').textContent = text;
}

// ── 渲染 ──
function renderAll() {
  renderTodayTasks();
  renderAlerts();
  renderMyTasks();
  renderAllTasks();
  renderCalendar();
}

function sortedKeys() {
  return Object.keys(assignments).sort((a,b) => a.localeCompare(b));
}

function chipHTML(role, person) {
  const cls = PERSON_COLOR[person] || 'none';
  const emoji = PERSON_EMOJI[person] || '？';
  const label = role === 'dropoff' ? '送' : '接';
  return `<div class="assign-chip chip-${cls}" onclick="openModal('${role}')">
    <span class="label">${label}</span>${emoji} ${person}
  </div>`;
}

function taskCardHTML(key, isMine) {
  const ev = assignments[key];
  const cls = isMine ? 'mine' : 'not-mine';
  const addrHTML = ev.addr ? `<div class="task-addr"><a href="${ev.map}" target="_blank">📍 ${ev.addr}</a></div>` : '';
  return `<div class="task-card ${cls}">
    <div class="task-header" onclick="openModalForKey('${key}')">
      <span class="task-name">${ev.name}</span>
      <span class="task-time">${ev.start}–${ev.end}</span>
    </div>
    <div class="task-body" onclick="openModalForKey('${key}')">
      ${chipHTML('dropoff', ev.dropoff)}
      ${chipHTML('pickup', ev.pickup)}
    </div>
    ${addrHTML}
  </div>`;
}

function renderTodayTasks() {
  const container = document.getElementById('today-tasks-list');
  if (!container) return;
  const today = new Date().toISOString().slice(0,10);
  const d = new Date(today + 'T00:00:00');
  const DAY = ['日','一','二','三','四','五','六'];
  const todayKeys = sortedKeys().filter(k => assignments[k].date === today);

  let html = `<div style="padding:16px 0 8px;font-size:1.5rem;font-weight:700;color:var(--accent)">
    📅 ${today.slice(5).replace('-','/')} 週${DAY[d.getDay()]}
  </div>`;

  const isVac = today >= '2026-08-03' && today <= '2026-08-07';
  if (isVac) {
    html += `<div class="vacation-banner"><div class="v-emoji">🧳</div><div class="v-text">家庭旅行週，好好玩！</div></div>`;
  }

  if (!todayKeys.length) {
    html += `<div class="my-tasks-empty">🌟 今天沒有倢芯的活動<br><span style="font-size:0.8rem">輕鬆一天！</span></div>`;
  } else {
    for (const k of todayKeys) {
      const isMine = assignments[k].dropoff === currentUser || assignments[k].pickup === currentUser;
      html += taskCardHTML(k, isMine);
    }
  }
  container.innerHTML = html;
}


function renderAlerts() {
  const container = document.getElementById('alert-section');
  if (!container) return;
  const today = new Date();
  const in7 = new Date(today); in7.setDate(today.getDate() + 7);
  const todayStr = today.toISOString().slice(0,10);
  const in7Str = in7.toISOString().slice(0,10);
  const DAY = ['日','一','二','三','四','五','六'];

  const unassigned = [];
  for (const k of sortedKeys()) {
    const ev = assignments[k];
    if (ev.date < todayStr || ev.date > in7Str) continue;
    const d = new Date(ev.date + 'T00:00:00');
    const label = `${ev.date.slice(5).replace('-','/')} 週${DAY[d.getDay()]} ${ev.start}`;
    if (!ev.dropoff || ev.dropoff === '未定') {
      unassigned.push({ key: k, ev, label, role: '送去' });
    }
    if (!ev.pickup || ev.pickup === '未定') {
      unassigned.push({ key: k, ev, label, role: '接回' });
    }
  }

  if (!unassigned.length) {
    container.innerHTML = `<div class="no-alerts">✅ 未來 7 天接送都已安排好！</div>`;
    return;
  }

  const personColor = {'爸爸':'var(--dad)','媽媽':'var(--mom)','奶奶':'var(--grandma)'};
  let html = `<div class="alert-section">
    <div class="alert-title">⚠️ 未來 7 天尚未完整安排（${unassigned.length} 項）</div>`;
  for (const item of unassigned) {
    const who = item.role === '送去' ? item.ev.dropoff : item.ev.pickup;
    const color = personColor[who] || 'var(--sub)';
    html += `<div class="alert-card" onclick="openModalForKey('${item.key}')">
      <div class="al-left">
        <div class="al-name">${item.ev.name}</div>
        <div class="al-date">${item.label}</div>
        <div class="al-role">${item.role} 未確認</div>
      </div>
      <div class="al-assign" style="color:${color}">${who || '未定'}</div>
    </div>`;
  }
  html += '</div>';
  container.innerHTML = html;
}

function renderMyTasks() {
  const container = document.getElementById('my-tasks-list');
  const keys = sortedKeys().filter(k => {
    const ev = assignments[k];
    return ev.dropoff === currentUser || ev.pickup === currentUser;
  });
  if (!keys.length) {
    container.innerHTML = `<div class="my-tasks-empty">🎉 目前沒有你的接送任務<br><span style="font-size:0.8rem">可到「全部行程」查看或調整分配</span></div>`;
    return;
  }
  let html = '', lastDate = '';
  const today = new Date().toISOString().slice(0,10);
  for (const k of keys) {
    const ev = assignments[k];
    if (ev.date !== lastDate) {
      lastDate = ev.date;
      const d = new Date(ev.date + 'T00:00:00');
      const isToday = ev.date === today;
      const dayStr = ['日','一','二','三','四','五','六'][d.getDay()];
      html += `<div class="day-label ${isToday?'today-label':''}">${ev.date.slice(5).replace('-','/')} 週${dayStr}${isToday?' ← 今天':''}</div>`;
    }
    html += taskCardHTML(k, true);
  }
  container.innerHTML = html;
}

function renderAllTasks() {
  const container = document.getElementById('all-tasks-list');
  const keys = sortedKeys();
  let html = '', lastDate = '';
  const today = new Date().toISOString().slice(0,10);
  for (const k of keys) {
    const ev = assignments[k];
    if (ev.date !== lastDate) {
      lastDate = ev.date;
      const d = new Date(ev.date + 'T00:00:00');
      const isToday = ev.date === today;
      const dayStr = ['日','一','二','三','四','五','六'][d.getDay()];
      html += `<div class="day-label ${isToday?'today-label':''}">${ev.date.slice(5).replace('-','/')} 週${dayStr}${isToday?' ← 今天':''}</div>`;
    }
    const isMine = ev.dropoff === currentUser || ev.pickup === currentUser;
    html += taskCardHTML(k, isMine);
  }
  container.innerHTML = html;
}

function renderCalendar() {
  const title = document.getElementById('month-title');
  title.textContent = `${calYear} 年 ${calMonth} 月`;
  const grid = document.getElementById('cal-grid');
  const days = ['日','一','二','三','四','五','六'];
  let html = days.map(d => `<div class="cal-header">${d}</div>`).join('');

  const firstDay = new Date(calYear, calMonth-1, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth, 0).getDate();
  const today = new Date().toISOString().slice(0,10);

  for (let i = 0; i < firstDay; i++) html += `<div class="cal-day empty"></div>`;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === today;
    const isVac = dateStr >= VACATION.start && dateStr <= VACATION.end;
    const dayKeys = Object.keys(assignments).filter(k => assignments[k].date === dateStr);
    const hasMine = dayKeys.some(k => assignments[k].dropoff === currentUser || assignments[k].pickup === currentUser);
    const dotsHTML = dayKeys.length ? `<div class="dot-row">${dayKeys.slice(0,3).map(()=>`<div class="dot"></div>`).join('')}</div>` : '';
    const vacLabel = isVac ? `<div class="vac-label">旅行</div>` : '';
    html += `<div class="cal-day ${isToday?'today':''} ${hasMine?'has-mine':''} ${isVac?'vacation':''}"
      onclick="showCalDay('${dateStr}')">
      <div class="day-num">${d}</div>
      ${dotsHTML}${vacLabel}
    </div>`;
  }
  grid.innerHTML = html;
}

function showCalDay(dateStr) {
  const detail = document.getElementById('cal-day-detail');
  const dayKeys = Object.keys(assignments).filter(k => assignments[k].date === dateStr);
  const isVac = dateStr >= VACATION.start && dateStr <= VACATION.end;
  if (!dayKeys.length && !isVac) { detail.innerHTML = ''; return; }
  const d = new Date(dateStr + 'T00:00:00');
  const dayStr = ['日','一','二','三','四','五','六'][d.getDay()];
  let html = `<div class="day-label today-label">${dateStr.slice(5).replace('-','/')} 週${dayStr}</div>`;
  if (isVac) html += `<div class="vacation-banner"><div class="v-emoji">🧳</div><div class="v-text">家庭旅行週</div></div>`;
  for (const k of dayKeys.sort()) {
    const isMine = assignments[k].dropoff === currentUser || assignments[k].pickup === currentUser;
    html += taskCardHTML(k, isMine);
  }
  detail.innerHTML = html;
}

function changeMonth(delta) {
  calMonth += delta;
  if (calMonth > 12) { calMonth = 1; calYear++; }
  if (calMonth < 1) { calMonth = 12; calYear--; }
  document.getElementById('cal-day-detail').innerHTML = '';
  renderCalendar();
}

// ── Tab ──
function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => {
    t.classList.toggle('active', ['today','my','all','cal'][i] === tab);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'today') renderTodayTasks();
}

// ── Modal ──
let _modalKey = null;
function openModalForKey(key) {
  _modalKey = key;
  const ev = assignments[key];
  document.getElementById('modal-title').textContent = ev.name;
  document.getElementById('modal-sub').textContent = `${ev.date.slice(5).replace('-','/')}　${ev.start}–${ev.end}`;
  editDropoff = ev.dropoff;
  editPickup = ev.pickup;
  updateModalSelections();
  document.getElementById('modal').classList.add('open');
}
function openModal() {}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');
  }
}
function selectPerson(role, person) {
  if (role === 'dropoff') editDropoff = person;
  else editPickup = person;
  updateModalSelections();
}
function updateModalSelections() {
  const map = {'爸爸':'dad','媽媽':'mom','奶奶':'grandma'};
  ['dropoff','pickup'].forEach(role => {
    const val = role === 'dropoff' ? editDropoff : editPickup;
    document.querySelectorAll(`#${role}-opts .person-opt`).forEach(el => {
      const isSelected = (el.className.includes(map[val]));
      el.classList.toggle('selected', isSelected);
    });
  });
}
async function saveModal() {
  if (!_modalKey) return;
  assignments[_modalKey].dropoff = editDropoff;
  assignments[_modalKey].pickup = editPickup;
  document.getElementById('modal').classList.remove('open');
  renderAll();
  showToast('已更新！同步中…');
  await pushData();
  showToast('✅ 已同步到雲端');
}

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── 初始化 ──
if (checkSetup()) {
  if (currentUser) {
    login(currentUser);
  }
}

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
